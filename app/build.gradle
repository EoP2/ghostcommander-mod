apply plugin: 'com.android.application'

android {
    publishNonDefault true

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdkVersion 34
    defaultConfig {
        applicationId "com.ghostsq.commander"
        minSdkVersion 21
        versionCode 479
        versionName "1.64.2b4.2"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    flavorDimensions "version"
    productFlavors {
        fdroid {
            dimension "version"
            targetSdkVersion 34
        }
        free {
            dimension "version"
            targetSdkVersion 34
        }
        root {
            dimension "version"
            //noinspection ExpiredTargetSdkVersion
            targetSdkVersion 29
            versionNameSuffix "-root"
        }
    }
    lint {
        checkReleaseBuilds false
    }
    namespace 'com.ghostsq.commander'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    // SMB
    // https://mvnrepository.com/artifact/eu.agno3.jcifs/jcifs-ng
    implementation group: 'eu.agno3.jcifs', name: 'jcifs-ng', version: '2.1.10'
    implementation group: 'org.slf4j', name: 'slf4j-android', version: '1.7.30'

// jcifs as source requires:
    // https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk15on
//    implementation group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.66'
    // https://mvnrepository.com/artifact/javax.annotation/javax.annotation-api
//    implementation group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'
    // https://mvnrepository.com/artifact/javax.servlet/javax.servlet-api
//    implementation group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'

    // SFTP
    // https://mvnrepository.com/artifact/com.github.mwiede/jsch
    // noinspection GradleDependency: Starting 0.2.17 SftpATTRS.java calls DateTimeFormatter.ofPattern() which only available on API 26+
    implementation group: 'com.github.mwiede', name: 'jsch', version: '0.2.16'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}

task createJar(type: Jar, dependsOn: ':app:compileFreeDebugJavaWithJavac') {
    from('build/intermediates/javac/freeDebug/classes/')
    setArchivesBaseName('com')
    destinationDirectory = file('..')
    doLast {
        println ":app classes were packed to ../com.jar\n"
    }
    mustRunAfter ':app:compileFreeDebugJavaWithJavac'
}
