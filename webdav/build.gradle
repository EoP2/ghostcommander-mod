apply plugin: 'com.android.application'

android {
    namespace 'com.ghostsq.commander.https'

    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.ghostsq.commander.https"
        minSdkVersion 19
        targetSdkVersion 31
        
        versionCode 15
        versionName "1.1b1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    lint {
        disable 'DuplicatePlatformClasses'
        disable 'ExpiredTargetSdkVersion'
    }
}
configurations {
    runtime.exclude group: "commons-logging", module: "commons-logging"
}

dependencies {
    implementation 'androidx.annotation:annotation:1.5.0'
    compileOnly fileTree(include: 'com.jar', dir: '..')

    implementation fileTree(dir: 'libs', include: ['*.jar','**/*.class'])

    //implementation files('libs/slf4j-android-1.7.25.jar')
    //implementation files('libs/slf4j-api-1.7.25.jar')

     // httpclient/httpcore + jackrabbit-webdav 现在统一由重新打包过命名空间的
     // httpclient-shaded.jar 提供。
    implementation fileTree(include: 'httpclient-shaded.jar', dir: '..')
    // https://mvnrepository.com/artifact/commons-codec/commons-codec
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.15'

    // https://mvnrepository.com/artifact/org.apache.commons/org.apache.commons.logging
//    implementation group: 'org.apache.commons', name: 'org.apache.commons.logging', version: '1.0.4.v200706111724'
    


/*
    // operates with ClassicHttpRequest instead of HttpRequest, thus not compatible with jackrabbit-webdav !
    // https://mvnrepository.com/artifact/org.apache.httpcomponents.client5/httpclient5
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.1.3'
*/


    // needed to bind a log implementation, such as slf4j-android
//    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.35'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-android
//    implementation group: 'org.slf4j', name: 'slf4j-android', version: '1.7.32'     // creates tag names with a '*'. Thus failed to enable it by the setprop command
//    implementation group: 'uk.uuid.slf4j', name: 'slf4j-android', version: '1.7.32-0' // no idea how to config
//    implementation( group: 'de.psdev.slf4j-android-logger', name: 'slf4j-android-logger', version: '1.0.5' )     // does not put the class name to the tag...
//    implementation 'com.noveogroup.android:android-logger:1.3.1'    // did not test http://noveogroup.github.io/android-logger/
}
