apply plugin: 'com.android.application'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdkVersion 34
    defaultConfig {
        applicationId "com.ghostsq.commander.yun139"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    namespace 'com.ghostsq.commander.yun139'
}

dependencies {
    // Only needed at compile time to resolve com.ghostsq.commander.* types (CommanderAdapter,
    // Engine, Utils, ...). At runtime those classes come from the host app process because this
    // plugin shares its android:sharedUserId / android:process, exactly like the webdav/box/gdrive
    // plugins. Build ../com.jar first by running the ':app:createJar' Gradle task.
    compileOnly fileTree(include: 'com.jar', dir: '..')
}
